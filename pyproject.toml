[project]
name = "stl"
version = "0.1.0"
description = "Semantic Trust Layer: AI-driven fraud and attack mitigation across the OSI stack"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Muhammad Abdul Ghani Qureshi" },
  { name = "Muhammad Usman Nasir" },
  { name = "Raja Mahad Ali" },
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "onnxruntime>=1.19",
  "tokenizers>=0.19",
  "tldextract>=5.1",
  "pillow>=10.3",
  "zxing-cpp>=2.2",
  "dpkt>=1.9.8",
  "joblib>=1.4",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "cryptography>=42",
  "aiosmtpd>=1.4",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
train = [
  "pandas>=2.2",
  "pyarrow>=16",
  "torch>=2.4",
  "transformers>=4.44",
  "accelerate>=0.33",
  "sentencepiece>=0.2",
  "protobuf>=4",
  "onnx>=1.16",
  "onnxscript>=0.1",
  "segno>=1.6",
]

[project.scripts]
stl = "stl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stl*"]

[tool.setuptools.package-data]
stl = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
